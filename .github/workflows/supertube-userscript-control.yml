name: SuperTube userscript loader one-shot patch

on:
  push:
    branches:
      - feat/supertube-userscript-control
    paths:
      - .github/workflows/supertube-userscript-control.yml

permissions:
  contents: write

jobs:
  patch-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/supertube-userscript-control

      - name: Patch Cobalt loader
        run: python3 tools/supertube/patch_userscript_loader.py

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/supertube-userscript-control.yml
          git add third_party/blink/renderer/core/dom/document.cc .github/workflows/supertube-userscript-control.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: route TizenTube userscript through SuperTube control"
          git push origin HEAD:feat/supertube-userscript-control
